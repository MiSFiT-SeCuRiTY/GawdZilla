{% extends "base.html" %}
{% block title %}GawdZilla — Change Password{% endblock %}
{% block heading %}CHANGE PASSWORD{% endblock %}

{% block body %}
<div class="card" style="max-width:480px">
  <h2>Change Admin Password</h2>

  {% if msg %}
    <div style="padding:10px;border-radius:4px;margin-bottom:12px;border:1px solid {{ 'var(--green)' if ok else 'var(--red)' }};color:{{ 'var(--green)' if ok else 'var(--red)' }}">
      {{ msg }}
    </div>
  {% endif %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {{ csrf_token() }}
    <div style="margin-bottom:10px">
      <label style="display:block;color:var(--dim);font-size:10px;letter-spacing:.2em;margin-bottom:4px">CURRENT PASSWORD</label>
      <input type="password" name="current" required>
    </div>
    <div style="margin-bottom:10px">
      <label style="display:block;color:var(--dim);font-size:10px;letter-spacing:.2em;margin-bottom:4px">NEW PASSWORD</label>
      <input type="password" name="new" required>
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;color:var(--dim);font-size:10px;letter-spacing:.2em;margin-bottom:4px">CONFIRM NEW PASSWORD</label>
      <input type="password" name="confirm" required>
    </div>
    <button type="submit">▸ Change Password</button>
  </form>
</div>
{% endblock %}
